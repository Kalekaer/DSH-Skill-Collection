body{background-image:

.wrap{max-width:1320px;margin:0 auto;padding:16px 20px 70px}

.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;border-bottom:3px solid var(--paper);padding-bottom:8px}

.hud .meta span{font:700 10px/1 var(--mono);letter-spacing:.14em;border:2px solid #3a3a36;padding:7px 9px;background:#121210;color:var(--paper)}

/* 货架 */
.rack{margin-top:26px;position:relative}
.rack-head{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.rack-head h2{margin:0;font:400 30px/1 "Big",Impact,sans-serif;letter-spacing:.01em;color:var(--paper);text-transform:uppercase}

.shelf{position:relative;padding:22px 16px 26px;border-left:6px solid #2b2d2e;border-right:6px solid #2b2d2e;

.shelf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(180deg,#2b2d2e,#141413)}
.rack + .rack .shelf{margin-top:6px}
.boxes{display:flex;flex-wrap:wrap;gap:22px 18px;align-items:flex-end;min-height:210px}

/* 纸箱 */
.box{position:relative;width:250px;min-height:190px;padding:14px 12px 12px;cursor:pointer;
  background:linear-gradient(160deg,#c09363,#a97a49 55%,#8a5f36);
  box-shadow:0 18px 26px -16px rgba(0,0,0,.9),inset 0 0 0 2px rgba(0,0,0,.18);

.boxes>.box{animation:boxIn .46s cubic-bezier(.2,.8,.2,1) both}
.boxes>.box:nth-child(2){animation-delay:.05s}
.boxes>.box:nth-child(3){animation-delay:.1s}
.boxes>.box:nth-child(4){animation-delay:.15s}
.boxes>.box:nth-child(5){animation-delay:.2s}
.boxes>.box:nth-child(6){animation-delay:.25s}
.boxes>.box:nth-child(7){animation-delay:.3s}
.boxes>.box:nth-child(8){animation-delay:.35s}

.box .flaps{position:absolute;left:0;right:0;top:-10px;height:14px;background:linear-gradient(180deg,#d8ab79,#b98a5a);border:2px solid rgba(0,0,0,.25);border-bottom:0}
.box .tapes{position:absolute;left:50%;top:-6px;width:34px;height:26px;margin-left:-17px;background:var(--fluoro);opacity:.92;

.box .label{position:relative;background:#f6f2e2;color:#141412;border:2px solid #141412;padding:9px 9px 8px;font-family:var(--mono);
  box-shadow:3px 3px 0 rgba(0,0,0,.35);transform:rotate(-.6deg)}
.box .label .top{display:flex;justify-content:space-between;font:700 8px/1.3 var(--mono);letter-spacing:.14em;color:#5a5a52;text-transform:uppercase}
.box .label .to{font:700 8px/1.4 var(--mono);letter-spacing:.1em;color:#8a2b1f;margin-top:2px}
.box .label .nm{margin:5px 0 4px;font:700 15px/1.2 var(--sans);letter-spacing:-.02em;color:#0a0a0a}
.box .label .ln{font:600 9px/1.5 var(--mono);color:#4a4a42}
.box .label .bc{display:flex;align-items:flex-end;gap:1px;height:22px;margin-top:6px}
.box .label .bc i{display:block;width:2px;height:100%;background:#141412}
.box .label .bc i:nth-child(3n){width:3px}
.box .label .bc i:nth-child(4n){height:70%}
.box .label .id{font:700 7px/1 var(--mono);letter-spacing:.16em;color:#6a6a60;margin-top:3px}
.box .tag{position:absolute;right:8px;top:8px;background:var(--magenta);color:#fff;font:700 8px/1 var(--mono);letter-spacing:.12em;padding:4px 6px;transform:rotate(4deg)}
.box.opened{background:linear-gradient(160deg,#b4895a,#96703f 60%,#7a5230)}
.box.opened .flaps{height:0;border:0;background:none}
.box.opened .inner{position:absolute;left:8px;right:8px;top:-16px;height:16px;background:#3a2a1c;border:2px solid rgba(0,0,0,.4);border-bottom:0}

      ((r.crit && r.crit.ft) || []).forEach(function (x) { crit += '<span>功能标签 · ' + esc(x) + '</span>'; });
      var best = 0;
      for (var bi = 0; bi < (r.tools || []).length; bi++) { if (['S', 'A', 'B'].indexOf(r.tools[bi].tier) >= 0) { best = bi; break; } }
      html += '<div class="role"><div class="r">' + String(idx + 1).padStart(2, '0') + ' · ' + esc(r.role) + '<small>' + (r.n || 0) + ' 条可用</small></div><div>'
        + '<p class="w">' + esc(r.why || '') + '</p>'
        + (crit ? '<div class="crit">' + crit + '</div>' : '')
        + '<div class="tlist">' + (r.tools || []).map(function (t, i) { return trow(t, i, false, best); }).join('') + '</div>'
        + '</div></div>';
    });
    html += '</div>';
    body.innerHTML = html;
    body.querySelector('.x').onclick = close;
    pd.classList.add('on'); document.documentElement.style.overflow = 'hidden'; body.scrollTop = 0;
  }

  function openWs(w) {
    var doneN = (w.tools || []).filter(function (t) { return t.done; }).length;
    var html = '<button class="x">×</button><div class="k">WORKSPACE · ' + esc(w.id) + '</div><h3>' + esc(w.name) + '</h3>'
      + '<p class="intro">' + esc(w.goal || '（缺：目标）') + '</p>'
      + '<div class="pmeta">'
      + '<span>状态 <b>' + esc(w.status || '—') + '</b></span>'
      + '<span><b>' + (w.tools || []).length + '</b> 件工具</span>'
      + '<span><b>' + doneN + '</b> 件已完成</span>'
      + '<span>' + esc(w.created || '') + ' → ' + esc(w.updated || '') + '</span>'
      + '</div>';
    html += '<div class="sec"><h4>用到的工具<i>✓ 表示已完成</i></h4><div class="tlist" style="max-height:none">'
      + (w.tools || []).map(function (t) { return trow(t, -1, true); }).join('')
      + '</div></div>';
    if (w.note) { html += '<div class="sec"><h4>备注 · 用户原话</h4><div class="note">' + esc(w.note) + '</div></div>'; }
    html += '<div class="foot"><span class="st' + (w.status === '完成' ? ' done' : '') + '">' + esc(w.status || '—') + '</span>'
      + '<span class="meta">' + esc(w.created || '') + ' → ' + esc(w.updated || '') + '</span></div>';
    body.innerHTML = html;
    body.querySelector('.x').onclick = close;
    pd.classList.add('on'); document.documentElement.style.overflow = 'hidden'; body.scrollTop = 0;
  }

  function bind(list, opener) {
    [].forEach.call(document.querySelectorAll('.box'), function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        for (var i = 0; i < list.length; i++) { if (list[i].id === id) { opener(list[i]); return; } }
      });
    });
  }
  bind(PLANS, openPlan); bind(WS, openWs);
  var qid = new URLSearchParams(location.search).get('open');
  if (qid) {
    PLANS.forEach(function (p) { if (p.id === qid) { openPlan(p); } });
    WS.forEach(function (w) { if (w.id === qid) { openWs(w); } });
  }

  /* 站点外壳的快捷键（1–4 / G / ESC）转发：焦点在页面里也能用 */
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) { return; }
    if (/^[1-4gG]$/.test(e.key) || e.key === 'Escape') {
      try { parent.postMessage({ __archiveKey: e.key }, '*'); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
