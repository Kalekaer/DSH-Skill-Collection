<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>计划与工作区 · 货架</title>
<style>
@font-face{font-family:"Bebas";src:url("../../assets/fonts/BebasNeue-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Big";src:url("../../assets/anton-latin.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"MonoX";src:url("../../assets/fonts/SpecialElite-Regular.ttf") format("truetype");font-display:swap}
:root{
  --ink:#0a0a0a;--paper:#f4f1e4;--kraft:#b98a5a;--kraft2:#8a5f36;
  --fluoro:#e9ff2e;--magenta:#ff1f6b;--grey:#8a8a86;--steel:#3a3d3e;
  --mono:SFMono-Regular,Consolas,monospace;
  --pd-bg:#f4f1e4;--pd-ink:#141412;--pd-ink2:#4a463a;--pd-accent:#ff1f6b;--pd-accent2:#e9ff2e;--pd-rule:#cfc6b2;--pd-note:#efe7d2;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b0a;color:var(--paper);font:14px/1.5 "Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif}
body{background-image:
  radial-gradient(900px 600px at 70% -10%,rgba(233,255,46,.10),transparent 60%),
  radial-gradient(700px 500px at 20% 110%,rgba(255,31,107,.08),transparent 60%),
  linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:auto,auto,48px 48px,48px 48px}
.wrap{max-width:1320px;margin:0 auto;padding:16px 20px 70px}
/* HUD 头 */
.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;border-bottom:3px solid var(--paper);padding-bottom:8px}
.hud h1{margin:0;font:400 64px/.82 "Big",Impact,sans-serif;letter-spacing:-.01em}
.hud h1 i{font-style:normal;color:var(--fluoro)}
.hud .sub{margin:6px 0 0;font:700 9px/1.6 var(--mono);letter-spacing:.24em;color:var(--grey);text-transform:uppercase}
.hud .meta{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:6px}
.hud .meta span{font:700 10px/1 var(--mono);letter-spacing:.14em;border:2px solid #3a3a36;padding:7px 9px;background:#121210;color:var(--paper)}
.hud .meta b{color:var(--fluoro)}

/* 货架 */
.rack{margin-top:26px;position:relative}
.rack-head{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.rack-head h2{margin:0;font:400 30px/1 "Big",Impact,sans-serif;letter-spacing:.01em;color:var(--paper);text-transform:uppercase}
.rack-head h2 span{color:var(--fluoro)}
.rack-head .hint{font:700 9px/1.6 var(--mono);letter-spacing:.16em;color:var(--grey);text-transform:uppercase}
.shelf{position:relative;padding:22px 16px 26px;border-left:6px solid #2b2d2e;border-right:6px solid #2b2d2e;
  background:
    repeating-linear-gradient(180deg,transparent 0 232px,#2b2d2e 232px 240px),
    linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%),
    repeating-linear-gradient(180deg,#141413 0 4px,#101010 4px 8px);
  box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(180deg,#2b2d2e,#141413)}
.rack + .rack .shelf{margin-top:6px}
.boxes{display:flex;flex-wrap:wrap;gap:22px 18px;align-items:flex-end;min-height:210px}

/* 纸箱 */
.box{position:relative;width:250px;min-height:190px;padding:14px 12px 12px;cursor:pointer;
  background:linear-gradient(160deg,#c09363,#a97a49 55%,#8a5f36);
  box-shadow:0 18px 26px -16px rgba(0,0,0,.9),inset 0 0 0 2px rgba(0,0,0,.18);
  transform:rotate(var(--r,0deg));transition:box-shadow .15s ease,outline-color .15s ease;outline:2px solid transparent;outline-offset:3px}
.box:hover{box-shadow:0 22px 34px -16px rgba(0,0,0,.95);outline-color:var(--fluoro);transform:rotate(var(--r,0deg)) translateY(-4px)}
@keyframes boxIn{from{opacity:0;transform:rotate(var(--r,0deg)) translateY(10px)}to{opacity:1;transform:rotate(var(--r,0deg)) translateY(0)}}
.boxes>.box{animation:boxIn .46s cubic-bezier(.2,.8,.2,1) both}
.boxes>.box:nth-child(2){animation-delay:.05s}
.boxes>.box:nth-child(3){animation-delay:.1s}
.boxes>.box:nth-child(4){animation-delay:.15s}
.boxes>.box:nth-child(5){animation-delay:.2s}
.boxes>.box:nth-child(6){animation-delay:.25s}
.boxes>.box:nth-child(7){animation-delay:.3s}
.boxes>.box:nth-child(8){animation-delay:.35s}
@media (prefers-reduced-motion:reduce){.boxes>.box{animation:none!important}}
.box .flaps{position:absolute;left:0;right:0;top:-10px;height:14px;background:linear-gradient(180deg,#d8ab79,#b98a5a);border:2px solid rgba(0,0,0,.25);border-bottom:0}
.box .tapes{position:absolute;left:50%;top:-6px;width:34px;height:26px;margin-left:-17px;background:var(--fluoro);opacity:.92;
  box-shadow:0 2px 0 rgba(0,0,0,.25);transform:rotate(-1deg)}
.box .label{position:relative;background:#f6f2e2;color:#141412;border:2px solid #141412;padding:9px 9px 8px;font-family:var(--mono);
  box-shadow:3px 3px 0 rgba(0,0,0,.35);transform:rotate(-.6deg)}
.box .label .top{display:flex;justify-content:space-between;font:700 8px/1.3 var(--mono);letter-spacing:.14em;color:#5a5a52;text-transform:uppercase}
.box .label .to{font:700 8px/1.4 var(--mono);letter-spacing:.1em;color:#8a2b1f;margin-top:2px}
.box .label .nm{margin:5px 0 4px;font:700 15px/1.2 var(--sans);letter-spacing:-.02em;color:#0a0a0a}
.box .label .ln{font:600 9px/1.5 var(--mono);color:#4a4a42}
.box .label .bc{display:flex;align-items:flex-end;gap:1px;height:22px;margin-top:6px}
.box .label .bc i{display:block;width:2px;height:100%;background:#141412}
.box .label .bc i:nth-child(3n){width:3px}
.box .label .bc i:nth-child(4n){height:70%}
.box .label .id{font:700 7px/1 var(--mono);letter-spacing:.16em;color:#6a6a60;margin-top:3px}
.box .tag{position:absolute;right:8px;top:8px;background:var(--magenta);color:#fff;font:700 8px/1 var(--mono);letter-spacing:.12em;padding:4px 6px;transform:rotate(4deg)}
.box.opened{background:linear-gradient(160deg,#b4895a,#96703f 60%,#7a5230)}
.box.opened .flaps{height:0;border:0;background:none}
.box.opened .inner{position:absolute;left:8px;right:8px;top:-16px;height:16px;background:#3a2a1c;border:2px solid rgba(0,0,0,.4);border-bottom:0}

/* 详情明细 */
.pmeta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.pmeta span{font:700 9px/1 var(--mono);letter-spacing:.14em;border:1px solid #3a3a36;padding:6px 8px;color:#cfc9b8}
.pmeta b{color:var(--fluoro)}
.crit{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 7px}
.crit span{font:700 8.5px/1.2 var(--mono);letter-spacing:.08em;padding:4px 6px;border:1px dashed #3a3a36;color:#9a968a}
.tlist{border-top:1px solid #2a2a27;scrollbar-width:thin;scrollbar-color:#3a3a36 #141413}
.trow{display:flex;gap:10px;align-items:baseline;padding:7px 2px;border-bottom:1px solid #232320;font:600 10.5px/1.5 var(--mono);color:#d8d3c2}
.trow .tn{flex:0 0 210px;color:var(--paper);word-break:break-all}
.trow .best{display:inline-block;margin-left:6px;background:var(--magenta);color:#fff;font:700 8px/1 var(--mono);letter-spacing:.1em;padding:3px 5px;vertical-align:2px}
.trow .ts{flex:0 0 62px;color:var(--fluoro)}
.trow .tt{flex:0 0 56px;font-size:9px;letter-spacing:.08em;border:1px solid #3a3a36;padding:3px 5px;text-align:center;color:#cfc9b8}
.trow .tt.S{background:var(--fluoro);color:#0a0a0a;border-color:var(--fluoro)}
.trow .to{flex:1 1 auto;min-width:0;font:400 11px/1.55 "Noto Serif SC","Songti SC",serif;color:#a8a394}
.trow .tl{flex:0 0 52px;font-size:8.5px;letter-spacing:.06em;color:#7a766a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tlk{flex:0 0 16px;color:var(--fluoro);text-decoration:none;font-size:12px}
.trow .tlk:hover{color:var(--magenta)}
.trow .ok{color:var(--fluoro);font-size:9px}
.pd .sec h4{display:flex;justify-content:space-between;align-items:baseline}
.pd .sec h4 i{font-style:normal;color:#6a6a60;font-weight:600;letter-spacing:.1em}
@media (max-width:760px){.trow{flex-wrap:wrap}.trow .tn{flex:1 1 100%}.trow .to{flex:1 1 100%}}
/* 详情浮窗 */
.pd-wrap{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:22px}
.pd-wrap.on{display:flex}
.pd-mask{position:absolute;inset:0;background:rgba(8,8,7,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pd{position:relative;width:min(900px,94vw);max-height:88vh;overflow:auto;background:#141413;color:var(--paper);
  border:3px solid var(--paper);box-shadow:12px 12px 0 var(--fluoro);padding:24px 26px 22px}
.pd .x{position:absolute;right:12px;top:12px;width:32px;height:32px;background:none;border:2px solid var(--paper);color:var(--paper);font:400 18px/1 var(--mono);cursor:pointer}
.pd .x:hover{background:var(--magenta);border-color:var(--magenta)}
.pd .k{font:700 9px/1 var(--mono);letter-spacing:.22em;color:var(--fluoro);text-transform:uppercase}
.pd h3{margin:6px 0 4px;font:400 40px/1 "Big",Impact,sans-serif;letter-spacing:.01em}
.pd .intro{margin:0 0 14px;font:400 13.5px/1.7 "Noto Serif SC","Songti SC",serif;color:#d8d3c2}
.pd .sec{border-top:1px solid #3a3a36;padding-top:12px;margin-top:12px}
.pd .sec h4{margin:0 0 8px;font:700 9px/1 var(--mono);letter-spacing:.2em;color:var(--grey);text-transform:uppercase}
.role{display:block;padding:12px 0 14px;border-bottom:1px dashed #33332f}
.role .r{font:700 14px/1.3 var(--sans);color:var(--fluoro);margin-bottom:4px}
.role .r small{display:inline-block;font:600 9px/1.5 var(--mono);letter-spacing:.1em;color:var(--grey);margin-left:10px;vertical-align:2px}
.role .w{font:400 12.5px/1.6 "Noto Serif SC",serif;color:#cfc9b8;margin:0 0 6px}
.pd .tools{display:flex;flex-wrap:wrap;gap:5px}
.role .tools{display:flex;flex-wrap:wrap;gap:5px}
.pd .tools span{font:700 9px/1.3 var(--mono);border:1px solid #3a3a36;padding:4px 6px;color:#d8d3c2}
.pd .tools span b{color:var(--fluoro)}
.pd .note{background:#1b1b19;border-left:3px solid var(--magenta);padding:10px 12px;font:400 12.5px/1.75 "Noto Serif SC",serif;color:#cfc9b8;white-space:pre-wrap}
.pd .foot{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pd .foot .st{font:700 9px/1 var(--mono);letter-spacing:.14em;padding:6px 8px;border:2px solid var(--fluoro);color:var(--fluoro)}
.pd .foot .st.done{background:var(--fluoro);color:#0a0a0a}
.pd .foot .meta{font:600 9px/1.6 var(--mono);color:var(--grey);letter-spacing:.1em}
.keyhint{margin-top:24px;font:700 9px/1.7 var(--mono);letter-spacing:.16em;color:#6a6a60;text-transform:uppercase}
.keyhint b{color:var(--fluoro);border:1.5px solid #3a3a36;padding:2px 5px;margin-right:4px}
@media (max-width:760px){.hud h1{font-size:44px}.boxes{gap:16px}.box{width:100%}.role{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hud">
    <div>
      <h1>PLANS<i>//</i>SHELF</h1>
      <p class="sub">组合预设 · 打包上线 · 拆箱看环节与工具</p>
    </div>
    <div class="meta">
      <span><b id="nPlan">0</b> PRESETS</span>
      <span><b id="nWs">0</b> WORKSPACES</span>
      <span class="y" style="background:var(--fluoro);color:#0a0a0a;border-color:var(--fluoro)">NO. 07 · 2026-10-17</span>
    </div>
  </header>

  <section class="rack">
    <div class="rack-head"><h2>组合预设<span> / PRESETS</span></h2><span class="hint">点箱子拆开 · 每个环节对应库里的工具</span></div>
    <div class="shelf"><div class="boxes" id="presetBoxes"></div></div>
  </section>

  <section class="rack">
    <div class="rack-head"><h2>我的工作区<span> / MINE</span></h2><span class="hint">已拆封的箱子：正在做什么、用到哪些工具</span></div>
    <div class="shelf"><div class="boxes" id="wsBoxes"></div></div>
  </section>

  <div class="keyhint"><b>ESC</b> 关窗 · <b>点箱子</b> 拆开看环节与工具</div>
</div>

<div class="pd-wrap" id="pd">
  <div class="pd-mask" id="pdMask"></div>
  <div class="pd" role="dialog" aria-modal="true" id="pdBody"></div>
</div>

<script>
var PLANS = /*__PLANS__*/[];
var WS = /*__WS__*/[];

(function () {
  function tierCn(t) { return ({ S: 'S 档', A: 'A 档', B: 'B 档', C: 'C 档', D: 'D 档', dropped: 'D 档' })[t] || (t ? t + ' 档' : 'D 档'); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hash(s) { var h = 0; s = String(s); for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
  function rot(id) { return ((hash(id) % 5) - 2) * 0.8; }
  function barcode(seed) {
    var h = hash(seed), out = '';
    for (var i = 0; i < 26; i++) { h = (h * 1103515245 + 12345) | 0; out += '<i style="height:' + (55 + (Math.abs(h) % 46)) + '%"></i>'; }
    return '<div class="bc">' + out + '</div>';
  }
  function box(p, kind) {
    var r = rot(p.id);
    return '<article class="box' + (kind === 'ws' ? ' opened' : '') + '" data-id="' + esc(p.id) + '" style="--r:' + r.toFixed(1) + 'deg">'
      + '<div class="flaps"></div><div class="tapes"></div>'
      + (kind === 'ws' ? '<div class="inner"></div>' : '')
      + '<div class="label">'
      + '<div class="top"><span>' + (kind === 'ws' ? 'WORKSPACE' : 'PRESET') + '</span><span>' + (kind === 'ws' ? (p.status || '—') : 'BOX ' + String(p.no).padStart(2, '0')) + '</span></div>'
      + '<div class="to">TO: 你的工作台</div>'
      + '<div class="nm">' + esc(p.name) + '</div>'
      + (kind === 'ws'
        ? '<div class="ln">' + (p.tools || []).length + ' 件工具 · 已完成 ' + (p.done || []).length + '</div>'
        : '<div class="ln">' + (p.roles || []).length + ' 个环节 · ' + (p.toolCount || 0) + ' 件工具</div>')
      + barcode(p.id)
      + '<div class="id">' + esc(p.id) + '</div>'
      + '</div>'
      + '</article>';
  }

  var pb = document.getElementById('presetBoxes'), wb = document.getElementById('wsBoxes');
  pb.innerHTML = PLANS.map(function (p, i) { p.no = i + 1; return box(p, 'preset'); }).join('');
  wb.innerHTML = WS.length ? WS.map(function (w) { return box(w, 'ws'); }).join('') : '<div style="color:#6a6a60;font:700 10px/1.6 var(--mono)">还没有工作区。</div>';
  document.getElementById('nPlan').textContent = PLANS.length;
  document.getElementById('nWs').textContent = WS.length;

  var pd = document.getElementById('pd'), body = document.getElementById('pdBody');
  function close() { pd.classList.remove('on'); document.documentElement.style.overflow = ''; }
  document.getElementById('pdMask').onclick = close;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { close(); } });

  function trow(t, i, isWs, bestIdx) {
    return '<div class="trow">'
      + '<span class="tn">' + esc(t.name) + (i === bestIdx && !isWs ? '<i class="best">首选</i>' : '') + '</span>'
      + '<span class="ts">★ ' + (t.stars || 0) + '</span>'
      + '<span class="tt ' + esc(t.tier || '') + '">' + esc(tierCn(t.tier)) + '</span>'
      + '<span class="tl">' + esc(t.lic || '—') + '</span>'
      + '<a class="tlk" href="https://github.com/' + esc(t.name) + '" target="_blank" rel="noopener" title="在 GitHub 打开">↗</a>'
      + '<span class="to">' + esc(t.one || '（缺：一句话说明）') + '</span>'
      + (isWs && t.done ? '<span class="ok">✓ 已完成</span>' : '')
      + '</div>';
  }
  function openPlan(p) {
    var html = '<button class="x">×</button><div class="k">PRESET · ' + esc(p.id) + '</div><h3>' + esc(p.name) + '</h3>'
      + '<p class="intro">' + esc(p.intro || '') + '</p>'
      + '<div class="pmeta">'
      + '<span><b>' + (p.roles || []).length + '</b> 个环节</span>'
      + '<span><b>' + (p.toolCount || 0) + '</b> 件可用工具（去重）</span>'
      + '<span><b>' + ((p.triggers || []).length) + '</b> 个触发词</span>'
      + '<span>' + esc(p.id) + '</span>'
      + '</div>';
    if (p.triggers && p.triggers.length) {
      html += '<div class="sec"><h4>什么时候用（触发词）</h4><div class="tools">' + p.triggers.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div></div>';
    }
    html += '<div class="sec"><h4>拆箱 · 每个环节与工具<i>工具由本地库按二级分类 / 功能标签自动匹配，按 star 排序 · 首选已标出</i></h4>';
    (p.roles || []).forEach(function (r, idx) {
      var crit = '';
      ((r.crit && r.crit.l2) || []).forEach(function (x) { crit += '<span>二级分类 · ' + esc(x) + '</span>'; });
      ((r.crit && r.crit.ft) || []).forEach(function (x) { crit += '<span>功能标签 · ' + esc(x) + '</span>'; });
      var best = 0;
      for (var bi = 0; bi < (r.tools || []).length; bi++) { if (['S', 'A', 'B'].indexOf(r.tools[bi].tier) >= 0) { best = bi; break; } }
      html += '<div class="role"><div class="r">' + String(idx + 1).padStart(2, '0') + ' · ' + esc(r.role) + '<small>' + (r.n || 0) + ' 条可用</small></div><div>'
        + '<p class="w">' + esc(r.why || '') + '</p>'
        + (crit ? '<div class="crit">' + crit + '</div>' : '')
        + '<div class="tlist">' + (r.tools || []).map(function (t, i) { return trow(t, i, false, best); }).join('') + '</div>'
        + '</div></div>';
    });
    html += '</div>';
    body.innerHTML = html;
    body.querySelector('.x').onclick = close;
    pd.classList.add('on'); document.documentElement.style.overflow = 'hidden'; body.scrollTop = 0;
  }

  function openWs(w) {
    var doneN = (w.tools || []).filter(function (t) { return t.done; }).length;
    var html = '<button class="x">×</button><div class="k">WORKSPACE · ' + esc(w.id) + '</div><h3>' + esc(w.name) + '</h3>'
      + '<p class="intro">' + esc(w.goal || '（缺：目标）') + '</p>'
      + '<div class="pmeta">'
      + '<span>状态 <b>' + esc(w.status || '—') + '</b></span>'
      + '<span><b>' + (w.tools || []).length + '</b> 件工具</span>'
      + '<span><b>' + doneN + '</b> 件已完成</span>'
      + '<span>' + esc(w.created || '') + ' → ' + esc(w.updated || '') + '</span>'
      + '</div>';
    html += '<div class="sec"><h4>用到的工具<i>✓ 表示已完成</i></h4><div class="tlist" style="max-height:none">'
      + (w.tools || []).map(function (t) { return trow(t, -1, true); }).join('')
      + '</div></div>';
    if (w.note) { html += '<div class="sec"><h4>备注 · 用户原话</h4><div class="note">' + esc(w.note) + '</div></div>'; }
    html += '<div class="foot"><span class="st' + (w.status === '完成' ? ' done' : '') + '">' + esc(w.status || '—') + '</span>'
      + '<span class="meta">' + esc(w.created || '') + ' → ' + esc(w.updated || '') + '</span></div>';
    body.innerHTML = html;
    body.querySelector('.x').onclick = close;
    pd.classList.add('on'); document.documentElement.style.overflow = 'hidden'; body.scrollTop = 0;
  }

  function bind(list, opener) {
    [].forEach.call(document.querySelectorAll('.box'), function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        for (var i = 0; i < list.length; i++) { if (list[i].id === id) { opener(list[i]); return; } }
      });
    });
  }
  bind(PLANS, openPlan); bind(WS, openWs);
  var qid = new URLSearchParams(location.search).get('open');
  if (qid) {
    PLANS.forEach(function (p) { if (p.id === qid) { openPlan(p); } });
    WS.forEach(function (w) { if (w.id === qid) { openWs(w); } });
  }

  /* 站点外壳的快捷键（1–4 / G / ESC）转发：焦点在页面里也能用 */
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) { return; }
